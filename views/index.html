<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Order Prototype</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .hidden {
            display: none;
        }

        .section {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
        }

        .menu-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .sold-out {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Mobile Order</h1>

    <!-- Login / Role Selection -->
    <div id="login-section" class="section">
        <h2>Login (Staff/Admin)</h2>
        <input type="email" id="email" placeholder="Email" value="admin@example.com">
        <input type="password" id="password" placeholder="Password" value="admin123">
        <button onclick="login()">Login</button>
        <hr>
        <h2>Guest Access</h2>
        <input type="text" id="guest-rest-id" placeholder="Restaurant ID to Enter">
        <button onclick="guestEnter()">Enter Restaurant</button>
        <div id="guest-error" class="error"></div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="section hidden">
        <h2>Admin</h2>
        <button onclick="logout()">Logout</button>
        <h3>Register Restaurant</h3>
        <input type="text" id="rest-name" placeholder="Restaurant Name">
        <input type="email" id="rest-email" placeholder="Owner Email">
        <input type="password" id="rest-pass" placeholder="Owner Password">
        <button onclick="createRest()">Create</button>
        <div id="rest-list"></div>
    </div>

    <!-- Restaurant Dashboard -->
    <div id="rest-dashboard" class="section hidden">
        <h2>Restaurant Management</h2>
        <button onclick="logout()">Logout</button>
        <h3>Add Menu Item</h3>
        <input type="text" id="menu-name" placeholder="Item Name">
        <input type="number" id="menu-price" placeholder="Price">
        <input type="number" id="menu-stock" placeholder="Stock">
        <button onclick="addMenuItem()">Add</button>
        <h3>Menu List</h3>
        <div id="manage-menu-list"></div>
    </div>

    <!-- Guest Interface -->
    <div id="guest-interface" class="section hidden">
        <h2 id="guest-title">Ordering...</h2>
        <div id="guest-menu-list"></div>
        <button style="margin-top:20px; width:100%; background:#f00; color:#fff;" onclick="checkout()">Checkout /
            Leave</button>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let role = localStorage.getItem('role');
        let sessionID = sessionStorage.getItem('sessionID');
        let currentRestID = sessionStorage.getItem('restID');

        if (token) {
            showDashboard(role);
        } else if (sessionID && currentRestID) {
            loadGuestMenu(); // Attempt to restore session
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (res.ok) {
                const data = await res.json();
                token = data.token;
                role = data.role;
                localStorage.setItem('token', token);
                localStorage.setItem('role', role);
                showDashboard(role);
            } else {
                alert('Login failed');
            }
        }

        function logout() {
            localStorage.clear();
            sessionStorage.clear();
            location.reload();
        }

        function showDashboard(role) {
            document.getElementById('login-section').classList.add('hidden');
            if (role === 'admin') {
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminData();
            } else if (role === 'restaurant') {
                document.getElementById('rest-dashboard').classList.remove('hidden');
                loadRestData();
            }
        }

        // --- Admin ---
        async function loadAdminData() {
            const res = await fetch('/admin/dashboard', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('rest-list').innerHTML = data.map(r => `<div>${r.Name} (ID: ${r.ID}) - ${r.CurrentGuestSession ? 'BUSY' : 'Free'}</div>`).join('');
        }

        async function createRest() {
            const name = document.getElementById('rest-name').value;
            const email = document.getElementById('rest-email').value;
            const password = document.getElementById('rest-pass').value;
            await fetch('/admin/restaurants', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name, email, password })
            });
            loadAdminData();
        }

        // --- Restaurant ---
        async function loadRestData() {
            const res = await fetch('/restaurant/dashboard', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            document.getElementById('manage-menu-list').innerHTML = data.map(m => `
                <div class="menu-item">
                    <span>${m.Name} (${m.Price}円) Stock: ${m.Stock}</span>
                    <button onclick="updateStock(${m.ID}, ${m.Stock}, ${!m.IsSoldOut})">
                        ${m.IsSoldOut ? 'Set Available' : 'Set Sold Out'}
                    </button>
                    <button onclick="updateStock(${m.ID}, ${m.Stock + 1}, ${m.IsSoldOut})">+1 Stock</button>
                </div>`).join('');
        }

        async function addMenuItem() {
            const name = document.getElementById('menu-name').value;
            const price = parseInt(document.getElementById('menu-price').value);
            const stock = parseInt(document.getElementById('menu-stock').value);
            await fetch('/restaurant/menu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name, price, stock })
            });
            loadRestData();
        }

        async function updateStock(id, stock, isSoldOut) {
            await fetch(`/restaurant/menu/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ stock: stock, is_sold_out: isSoldOut })
            });
            loadRestData();
        }

        // --- Guest ---
        async function guestEnter() {
            const id = document.getElementById('guest-rest-id').value;
            if (!id) return;

            const res = await fetch(`/guest/${id}/checkin`, { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                sessionID = data.session_id;
                currentRestID = id;
                sessionStorage.setItem('sessionID', sessionID);
                sessionStorage.setItem('restID', id);
                loadGuestMenu();
            } else {
                const err = await res.json();
                document.getElementById('guest-error').innerText = err.message || 'Error entered';
            }
        }

        async function loadGuestMenu() {
            const res = await fetch(`/guest/${currentRestID}/menu?session_id=${sessionID}`);
            if (res.ok) {
                const data = await res.json();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('guest-interface').classList.remove('hidden');
                document.getElementById('guest-menu-list').innerHTML = data.map(m => `
                    <div class="menu-item ${m.IsSoldOut ? 'sold-out' : ''}">
                        <span>${m.Name}</span>
                        <span>${m.Price}円</span>
                        <button ${m.IsSoldOut ? 'disabled' : ''}>Order</button>
                    </div>`).join('');
            } else {
                // Session likely expired or kicked out
                alert('Session expired or access denied');
                logout();
            }
        }

        async function checkout() {
            await fetch(`/guest/${currentRestID}/checkout?session_id=${sessionID}`, { method: 'POST' });
            alert('Checked out. Thank you!');
            logout();
        }
    </script>
</body>

</html>
